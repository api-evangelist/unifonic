source: https://docs.unifonic.com/articles/api-documentation/http-status-codes
format: custom
description: >-
  Unifonic API error surface, captured from the published HTTP Status Codes
  reference on docs.unifonic.com and the 4xx/5xx responses declared in the
  three official OpenAPI documents in this repo's openapi/ directory. Unifonic
  does not use RFC 9457 application/problem+json; the SMS (NextGen) REST API
  returns a JSON envelope {success, message, errorCode, data} with ER-XX error
  codes and signals request-level failures through an extended set of
  HTTP-style status codes (many non-standard, e.g. 455, 480), while the
  Authenticate API returns response_status plus a numeric error_code field.
envelope:
  sms_rest_api:
    shape: '{ "success": "true|false", "message": "...", "errorCode": "ER-00", "data": { } }'
    note: errorCode ER-00 indicates success; declared in openapi/unifonic-sms-openapi-original.json response examples.
  authenticate_api:
    shape: '{ "id": "...", "response_status": "correct|incorrect", "error_code": 101 }'
    note: declared in the Verification schema of openapi/unifonic-authenticate-openapi-original.json.

