- aid: unifonic:unifonic-conversations-whatsapp-api
  name: Unifonic Conversations (WhatsApp) API
  description: >-
    The Unifonic Conversations API sends WhatsApp template and session messages and manages the WhatsApp
    service: template management and Meta catalog retrieval endpoints, incoming-message and delivery-status
    webhooks, and account-management event notifications, authenticated with a publicId and secret key
    pair. A WhatsApp sandbox with registered test numbers supports development.
  humanURL: https://docs.unifonic.com/articles/products-documentation/whatsapp-apis
