aid: unifonic
name: Unifonic
description: >-
  Unifonic is a Saudi Arabia-based customer engagement and CPaaS platform,
  backed by SoftBank Vision Fund, that powers SMS, WhatsApp, voice, push
  notification, and OTP-verification communication for enterprises across the
  Middle East and beyond. Its developer surface spans an SMS (NextGen) REST
  API, an Authenticate API for multi-channel OTP verification, Voice APIs for
  calls, IVR, and number masking, and a WhatsApp Conversations API with
  template, session, and management endpoints, alongside webhooks for
  delivery status and channel events, mobile push SDKs, a web event-tracking
  SDK, chatbot and Flow Studio automation products, and a WhatsApp sandbox
  for testing.
