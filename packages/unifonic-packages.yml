description: >-
  Client libraries for the Unifonic APIs found across the public package
  registries and the product docs. Unifonic maintains no official registry
  organization and no official GitHub organization (github.com/unifonic
  returns 404), but its docs distribute first-party mobile push SDKs — the
  React Native push library is installed from npm as react-native-unifonic-push
  per docs.unifonic.com, and iOS/Android/Flutter push SDKs are documented as
  provider-supplied. The server-side API ecosystem is otherwise
  community-maintained wrappers, including a Symfony Notifier bridge
  maintained by the Symfony project (third-party relative to Unifonic). PyPI,
  Maven Central, and crates.io have no unifonic packages.
first_party_found: true
